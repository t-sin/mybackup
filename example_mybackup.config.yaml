log:
  # ログレベル。`Logger::Severity`の文字列を使う。
  level: info
  # ログが出力されるディレクトリ。
  directory: ~/tmp/mybackup_logs
# 除外するパスのパターン
# 詳細はrsyncのmanのFILTER RULESを参照。
exclude_patterns:
  - Application Data/Hoge
# fromがディレクトリのとき、末尾のスラッシュによって動作が変わる。
# もし末尾スラッシュのfromなら、fromのディレクトリ内の全てがto内にコピーされる。
# もし末尾スラッシュなしのfromなら、fromのディレクトリそのものがto内につくられる。
#
# このへんはrsyncの挙動。
# リモートがfromやtoのときはリモート側でシェル展開など発生する。
# 吸収するにはさまざまなケースがありそうだったので、このへんの差異をこのツールでは吸収しないことにした。
backups:
  - name: my home directory
    type: local
    from: /home/username/
    to: /path/to/backup_data/username_home/
  # リモートサーバのときはsshをつかって同期を行う。いちおう鍵ファイルを指定できるようにしておいた。
  - name: minecraft data on my server
    type: remote
    identity_file: ~/.ssh/my-server.id
    from: "my-mc-server:~/mincraft_data/"
    to: /path/to/backup_data/minecraft_server_data/
