log:
  # Log level defined in Logger::Severity
  level: info
  # A directory to be placed logs like YYYY-MM-DD_mybakcup.log
  directory: ~/tmp/mybackup_logs
# Patterns for paths to be excluded
# For more detail, see FILTER RULES section in `man rsync`
exclude_patterns:
  - Application Data/Hoge
# If you write a directory as source path, take care a slash at end of path.
# rsync treats paths different way by a slash at end of path.
# - A source path ends with a slash: "transfer all files in a source path into root of a dest directory."
# - A source path not ends with a slash "transfer a source directory as a dest directory" (but not such behavior with remote paths)
backups:
  - name: my home directory
    type: local
    from: /home/username/
    to: /path/to/backup_data/username_home/
  # backup between remote and local directories via ssh
  - name: minecraft data on my server
    type: remote
    identity_file: ~/.ssh/my-server.id
    from: "my-mc-server:~/mincraft_data/"
    to: /path/to/backup_data/minecraft_server_data/
